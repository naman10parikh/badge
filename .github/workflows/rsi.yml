name: badge RSI
# CP123 D2: the deterministic ($0, tokenless) RSI engine runs on a daily schedule AND on
# demand. The Claude half (brain-file rewrite on a real watchlist delta) additionally needs
# CLAUDE_CODE_OAUTH_TOKEN (chairman checklist, D8); without it the engine still runs live.
# CP158: the scheduled run is LIVE (it fetches the public watchlist, flags real changes in
# brain/ORG_MEMORY.md and re-runs the eval gate), keeps the last snapshot in the Actions cache
# so only real changes are flagged, and uploads the result as a proposal for a person to
# review. It needs no secret, never commits and never merges.
on:
  schedule:
    # 09:17 UTC daily — a deliberately off-the-hour minute to avoid GH Actions cron congestion.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build so the eval/CLI helpers the engine calls exist.
      - run: pnpm build
      - name: Restore the last watchlist snapshot
        uses: actions/cache@v4
        with:
          path: workflows/.watchlist-snapshot.json
          key: rsi-watchlist-${{ github.run_id }}
          restore-keys: rsi-watchlist-
      - name: Run the RSI engine live (watch, flag, re-run the eval gate)
        run: node workflows/rsi.workflow.js
      - name: Write the proposal (a diff for review; the loop never commits)
        if: always()
        run: git diff -- brain > rsi-proposal.diff; cat rsi-proposal.diff
      - name: Upload the proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-proposal
          path: |
            rsi-proposal.diff
            workflows/.watchlist-snapshot.json
          if-no-files-found: ignore
      - name: Open or update the proposal issue for a person to review
        if: always() && hashFiles('rsi-proposal.diff') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s rsi-proposal.diff ] || { echo "The brain diff is empty, so there is nothing to propose."; exit 0; }
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            echo '````diff'
            cat rsi-proposal.diff
            echo '````'
          } > "$RUNNER_TEMP/proposal-issue.md"
          number=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/proposal-issue.md"
          else
            gh issue create --title "Badge: proposal from the self-improvement loop" --label proposal --body-file "$RUNNER_TEMP/proposal-issue.md"
          fi
