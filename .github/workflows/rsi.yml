name: badge RSI
# CP123 D2: the deterministic ($0, tokenless) RSI engine runs on a daily schedule AND on
# demand. The Claude half (brain-file rewrite on a real watchlist delta) additionally needs
# CLAUDE_CODE_OAUTH_TOKEN (chairman checklist, D8) — until that lands, the engine runs in
# --dry-run (no network, no writes) and its exit-0 IS the guard (always green).
on:
  schedule:
    # 09:17 UTC daily — a deliberately off-the-hour minute to avoid GH Actions cron congestion.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build so the eval/CLI helpers the engine may call exist; non-fatal if a sibling
      # eval item (E1) hasn't landed — the engine skips the eval gate gracefully.
      - run: pnpm build
      - name: Run the deterministic RSI engine (dry-run is the guard)
        run: node workflows/rsi.workflow.js --dry-run
