name: badge acceptance
# CP123 E2 / G1 — THE acceptance test (PLAN §5). Runs inside the GitHub Actions ubuntu
# runner (the documented isolated/reproducible env, HARNESS-OVERRIDES §11 — E2B is NOT a
# hard CI gate; the runner satisfies the isolation need). `pnpm run acceptance` scaffolds
# Clerk auth into an ephemeral create-next-app and drives the sign-in → protected-route E2E
# ×3 (pass^k). If the CLERK_TEST_* secrets are absent the job FAILS LOUDLY (the runner exits
# 1, not skipped) → forces the §8 provisioning (S1). Acceptance-not-green ⇒ badge is NOT done.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      # Clerk TEST instance keys (mirrored to GH Actions secrets by S1). The acceptance
      # runner reads these from the env; never hard-coded, never committed.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      CLERK_TEST_USER_EMAIL: ${{ secrets.CLERK_TEST_USER_EMAIL }}
      CLERK_TEST_USER_PASSWORD: ${{ secrets.CLERK_TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install + build badge (the employee's hands)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Acceptance — badge init clerk → sign-in→protected E2E ×3 (pass^k)
        run: pnpm run acceptance
