name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harness skeleton present
        run: |
          set -e
          for f in identity/SOUL.md brain dsip.json AGENTS.md CLAUDE.md llms.txt .claude-plugin/plugin.json .mcp.json; do
            [ -e "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "harness skeleton OK"
      - name: Secret scan (no real keys in tree)
        run: |
          set -e
          if grep -rInE 'sk-ant-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[bap]-' \
               --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::potential real secret committed"; exit 1
          fi
          echo "secret scan clean"

  build-test:
    runs-on: ubuntu-latest
    # Backstop: a Playwright/browser-download hang fast-fails at 15min instead of GitHub's 6h job ceiling.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect runtime
        id: rt
        run: |
          if [ -f package.json ]; then echo "armed=true" >> "$GITHUB_OUTPUT"; else echo "armed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install + build + test (red-blocking once code exists)
        if: steps.rt.outputs.armed == 'true'
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
          pnpm test
      - name: Eval pyramid (E1) — L1 asserts + 14 golden tasks + L2 F1 (red-blocking)
        # CP123 E1 / Component 9 (PLAN §6, HARNESS-OVERRIDES §9). `npm run eval` graders
        # (Resolution-keyword coverage per golden task + the L2 macro-F1 over the 50-row
        # labeled set) live in eval/run.mjs and are NOT exercised by `pnpm test` (vitest
        # only runs *.test.ts). Without this step a broken golden answer leaves CI green —
        # proven by negative control (Wave T). This step makes "a deliberately-broken golden
        # answer turns CI red" actually true. Needs the build above (eval imports dist/).
        if: steps.rt.outputs.armed == 'true'
        run: pnpm run eval
      - name: Cockpit E2E (G2) — ask-the-employee renders a classify answer (red-blocking)
        # CP123 G2 (PLAN §9/§10). playwright.config.ts boots the zero-dep stdlib cockpit
        # server on :7788 itself (webServer) and drives the SPA; no Clerk keys needed (this
        # is the cockpit, not the acceptance E2E). A regression in any cockpit view turns
        # CI red here.
        if: steps.rt.outputs.armed == 'true'
        run: |
          # Download-only — NO `--with-deps` apt (the unkillable-by-`timeout` sudo-grandchild 6h-hang,
          # turbo Wave-T); GH ubuntu-latest already ships chromium's libs. `pnpm exec` → the pinned
          # @playwright/test@1.60.0 devDep (no version drift). `timeout 200`×3 fast-fails a stalled CDN pull.
          ok=0
          for i in 1 2 3; do
            if timeout 200 pnpm exec playwright install chromium; then ok=1; break; fi
            echo "::warning::playwright chromium install attempt $i stalled (>200s) — retrying"
          done
          [ "$ok" = 1 ] || { echo "::error::playwright chromium install failed after 3 attempts"; exit 1; }
          pnpm exec playwright test cockpit
      - name: Skeleton phase
        if: steps.rt.outputs.armed == 'false'
        run: echo "skeleton phase — build gate auto-arms when package.json lands (CP123 Wave B)"
