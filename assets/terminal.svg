<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">badge --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: badge [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Auth employee — AuthN/AuthZ/SSO + agent identity. Scaffolds, classifies (P1-P4),</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">audits OAuth/MCP, triages SAML.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -v, --version                    print badge version</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  --json                           emit structured JSON instead of</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">                                   human-readable output</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  -h, --help                       display help for command</text>
<text x="24" y="286" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  init [options]                   scaffold auth into a target app to a working</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                                   sign-in→protected-route flow (the acceptance</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                                   test)</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  classify [options] &lt;task&gt;        place plane (1/2) + classify P1-P4, return</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                                   the default tool + why (badge's core verb)</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">  advise [options]                 a DECISION with $ breakpoints + the</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                                   boring-enterprise checklist, not a feature</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                                   table (OP O5)</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  audit [options] &lt;path&gt;           run the pitfall checklist (PKCE method,</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">                                   RFC-8707 bind, account-linking, rotation,</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                                   redirect, alg=none)</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  saml-triage [options] &lt;symptom&gt;  the 7-step SSO/SAML triage runbook</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                                   (timestamps→cert→ACS→Issuer→Audience→sig-alg→Destination)</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
